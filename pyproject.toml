[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "priore"
version = "0.2.0"
description = "XAUUSD M5/M15 analysis backend for the Priore Android app"
requires-python = ">=3.11"
dependencies = [
  "ctrader-open-api>=0.9.2,<1.0.0",
  "firebase-admin>=7.0,<8.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[project.scripts]
priore = "priore.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
