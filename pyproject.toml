[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "priore"
version = "0.1.0"
description = "Read-only XAUUSD M5/M15 market assistant using cTrader Open API"
requires-python = ">=3.11"
dependencies = [
  "ctrader-open-api>=0.9.2,<1.0.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[project.scripts]
priore = "priore.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
